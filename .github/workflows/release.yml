name: Publicar versión

# Al llegar a main un VERSION nuevo, crea el tag vX.Y.Z y la release con su sección del CHANGELOG.
on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear tag y release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "$v ya existe"; exit 0
          fi
          awk -v ver="## ${v#v}" '$0 == ver {dentro=1; next} /^## / && dentro {exit} dentro' CHANGELOG.md > notas.md
          gh release create "$v" --title "$v" --notes-file notas.md --target "$GITHUB_SHA"
